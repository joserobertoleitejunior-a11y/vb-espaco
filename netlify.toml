[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# a pré-visualização do passo a passo de criação roda dentro de um
# iframe do próprio site (criar.html) — precisa liberar isso especificamente,
# senão o navegador bloqueia o iframe por causa do X-Frame-Options:DENY acima.
[[headers]]
  for = "/preview-embutido.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

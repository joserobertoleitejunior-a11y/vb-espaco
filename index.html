<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VB Espaço — salões, barbearias e estúdios em Itapetininga</title>
<meta name="description" content="Encontre e agende num clique: barbearias, salões de beleza, manicure e pedicure, e estética em Itapetininga.">
<link rel="stylesheet" href="assets/css/styles.css?v=2">

<body>
  <header class="topbar">
    <a class="brand" href="index.html">VB <em>Espaço</em></a>
    <a class="btn btn-ghost" href="cadastro.html" style="padding:0.5rem 1rem; font-size:0.85rem;">Cadastrar meu estabelecimento</a>

  <div class="container" style="padding-top:1.5rem;">

      <div class="card"><div class="skeleton" style="height:1.4rem; width:50%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:1rem; width:30%;"></div></div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

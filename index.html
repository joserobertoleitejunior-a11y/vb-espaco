<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VB Agenda — salões, barbearias e estúdios em Itapetininga</title>
<meta name="description" content="Encontre e agende num clique: barbearias, salões de beleza, manicure e pedicure, e estética em Itapetininga.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=29">

<body class="com-tabbar">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span id="cube3d" aria-hidden="true"></span>
      VB <em>Agenda</em>
    </a>
    <span class="topbar-local"><svg class="icone-inline" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/></svg> Itapetininga</span>
    <button type="button" class="cliente-global-btn" id="clienteGlobalBtn" style="border-color:var(--borda); color:var(--tinta);">Entrar</button>
  </header>

  <div class="container" style="padding-top:1.25rem;">
    <p class="cliente-saudacao oculto" id="clienteSaudacao" style="color:var(--tinta);"></p>
    <div class="busca-wrap">
      <span class="busca-icone"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input class="busca-input" id="buscaInput" type="search" placeholder="Busque pelo nome do estabelecimento">
    </div>

    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por segmento">
      <button class="chip is-ativo" type="button" data-segmento="" aria-pressed="true">Tudo</button>
      <button class="chip" type="button" data-segmento="barbearia" aria-pressed="false"><svg class="icone-inline" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><line x1="8.1" y1="7.5" x2="20" y2="19"/><line x1="8.1" y1="16.5" x2="20" y2="5"/></svg> Barbearia</button>
      <button class="chip" type="button" data-segmento="salao" aria-pressed="false"><svg class="icone-inline" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18c2-4 2-8 0-12"/><path d="M9 18c2-4 2-8 0-12"/><path d="M14 18c2-4 2-8 0-12"/><path d="M19 18c2-4 2-8 0-12"/></svg> Salão</button>
      <button class="chip" type="button" data-segmento="manicure_pedicure" aria-pressed="false"><svg class="icone-inline" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2h6v3l1.5 2v13a1 1 0 01-1 1h-7a1 1 0 01-1-1V7L9 5V2z"/><path d="M9 2h6"/></svg> Manicure e pedicure</button>
      <button class="chip" type="button" data-segmento="estetica" aria-pressed="false"><svg class="icone-inline" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2L14.3 7.7L20 10L14.3 12.3L12 18L9.7 12.3L4 10L9.7 7.7z"/></svg> Estética</button>
      <button class="chip" type="button" data-segmento="estetica_automotiva" aria-pressed="false"><svg class="icone-inline" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l1.5-4.5A2 2 0 0 1 6.4 6h11.2a2 2 0 0 1 1.9 1.5L21 12"/><path d="M3 12h18v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4z"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg> Estética automotiva</button>
    </div>

    <div id="listaCatalogo" style="padding-bottom:1rem;">
      <div class="card"><div class="skeleton" style="height:1.4rem; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:1rem; width:35%;"></div></div>
      <div class="card"><div class="skeleton" style="height:1.4rem; width:50%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:1rem; width:30%;"></div></div>
    </div>
  </div>

  <div class="admin-pin-overlay oculto" id="clienteGlobalOverlay">
    <div class="admin-pin-box cliente-global-box">
      <div id="clienteGlobalEstagioTelefone">
        <p class="eyebrow">VB Agenda</p>
        <h2 style="margin:0.3rem 0;">Entrar com WhatsApp</h2>
        <p class="hint">Assim você não precisa digitar seus dados de novo em cada estabelecimento.</p>
        <div class="field">
          <input type="tel" id="clienteGlobalTelefoneInput" placeholder="Seu WhatsApp com DDD" autocomplete="off">
        </div>
        <button class="btn btn-primario" id="clienteGlobalContinuar" type="button" style="width:100%;">Continuar</button>
        <button class="btn btn-ghost" id="clienteGlobalCancelar" type="button" style="width:100%; margin-top:0.5rem;">Cancelar</button>
      </div>
      <div id="clienteGlobalEstagioNome" class="oculto">
        <p class="eyebrow">Primeira vez por aqui</p>
        <h2 style="margin:0.3rem 0;">Como podemos te chamar?</h2>
        <div class="field">
          <input type="text" id="clienteGlobalNomeInput" placeholder="Seu nome" autocomplete="off">
        </div>
        <button class="btn btn-primario" id="clienteGlobalConfirmarNome" type="button" style="width:100%;">Confirmar</button>
        <button class="btn btn-ghost" id="clienteGlobalVoltarTelefone" type="button" style="width:100%; margin-top:0.5rem;">Voltar</button>
      </div>
      <p class="msg" id="clienteGlobalMsg"></p>
    </div>
  </div>

  <div class="admin-painel-overlay oculto" id="meusAgendamentosOverlay">
    <div class="admin-painel-box">
      <div class="admin-painel-topo">
        <p style="font-weight:800; margin:0 0 0.7rem; font-size:1.05rem;">Meus agendamentos</p>
        <button type="button" class="admin-painel-fechar" id="magFechar" aria-label="Fechar">×</button>
      </div>
      <div class="admin-painel-corpo" id="magCorpo"></div>
      <div style="padding:0 1rem 1rem; flex-shrink:0;">
        <button type="button" class="btn btn-ghost" id="magSair" style="width:100%;">Sair da conta</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tabbar-item is-ativo" href="index.html"><svg class="tabbar-icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>Catálogo</a>
    <a class="tabbar-item" href="criar.html"><svg class="tabbar-icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Criar meu site</a>
    <a class="tabbar-item" href="cadastro.html"><svg class="tabbar-icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1-5h16l1 5"/><path d="M3 9a2 2 0 004 0 2 2 0 004 0 2 2 0 004 0 2 2 0 004 0"/><path d="M5 9v10h14V9"/><path d="M9 19v-6h6v6"/></svg>Cadastrar</a>

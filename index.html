<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VB Espaço — salões, barbearias e estúdios em Itapetininga</title>
<meta name="description" content="Encontre e agende num clique: barbearias, salões de beleza, manicure e pedicure, e estética em Itapetininga.">
<link rel="stylesheet" href="assets/css/styles.css?v=3">
</head>
<body class="com-tabbar">
  <header class="topbar">
    <a class="brand" href="index.html">VB <em>Espaço</em></a>
    <span class="topbar-local">📍 Itapetininga</span>

    <div class="filtros" id="filtros">
      <button class="chip is-ativo" data-segmento="">Tudo</button>
      <button class="chip" data-segmento="barbearia">💈 Barbearia</button>

      <button class="chip" data-segmento="estetica">✨ Estética</button>

    <div id="listaCatalogo" style="padding-bottom:1rem;">
      <div class="card"><div class="skeleton" style="height:1.4rem; width:60%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:1rem; width:35%;"></div></div>
      <div class="card"><div class="skeleton" style="height:1.4rem; width:50%; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:1rem; width:30%;"></div></div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tabbar-item is-ativo" href="index.html"><span class="tabbar-icone">🏠</span>Catálogo</a>
    <a class="tabbar-item" href="cadastro.html"><span class="tabbar-icone">🏪</span>Cadastrar</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js?v=1"></script>
  <script src="assets/js/catalogo.js?v=2"></script>

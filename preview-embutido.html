<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pré-visualização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tpl-classico/css/base.css?v=4" id="tplBase">
<link rel="stylesheet" href="/assets/tpl-classico/css/feminino.css?v=1" id="tplFeminino" disabled>
<style>
  /* a foto do hero, no template real, ocupa quase a tela inteira (min-height:100vh
     no desktop, 78vh no mobile) — dentro do iframe de preview isso vira uma
     altura fixa, senão o miolo do site nem cabe na moldura do passo a passo */
  html, body { margin:0; overflow:hidden; }
  .hero-split { min-height: 620px !important; }
  .hero-split-photo { min-height: 620px !important; }
  @media (max-width:900px) { .hero-split-photo { min-height: 380px !important; } }
</style>
</head>
<body>
  <div id="tplClassico">
    <header class="site-topbar on-hero">
      <a class="brand" href="#"><span class="brand-mark">❧</span> <span id="tplNomeTopo">Seu estabelecimento</span></a>
      <div class="topbar-actions">
        <button class="hamburger" type="button" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      </div>
    </header>
    <main>
      <section class="hero-split">
        <div class="hero-split-frame" aria-hidden="true"></div>
        <div class="hero-split-copy">
          <p class="eyebrow" id="tplEyebrow">Estabelecimento · Cidade</p>
          <h1 id="tplHeadline">Seu estilo, sem complicação.</h1>
          <p id="tplSubcopy">Agende seu horário com poucos toques — escolha o serviço e o dia que preferir.</p>
          <div class="hero-cta">
            <button class="btn" type="button"><span id="tplCtaTexto">Agendar horário</span> →</button>
          </div>
        </div>
        <div class="hero-split-photo" id="tplHeroFoto" role="img" aria-label="Foto do estabelecimento" style="position:relative;"></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/criar-preview.js?v=2"></script>
</body>
</html>

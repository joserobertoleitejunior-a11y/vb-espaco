<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Repasses aos criadores | Matriz</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6f6f8; color: #1f2024; }
  main { max-width: 560px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; } p { color: #55575f; line-height: 1.45; }
  .c { background: #fff; border: 1.5px solid #e9e9ee; border-radius: 16px; padding: .9rem; margin: .7rem 0; }
  .c b { font-size: 1.15rem; } .c small { color: #6b6d75; display: block; }
  button { min-height: 2.8rem; padding: .5rem 1rem; border: 0; border-radius: 999px; background: #1f2024; color: #fff; font: inherit; font-weight: 800; cursor: pointer; margin-top: .5rem; }
  button:disabled { opacity: .45; cursor: default; }
  .ok { color: #17784b; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Repasses aos criadores</h1>
  <p>Comissões de meses já fechados. Pague por Pix e depois toque em "Marcei como pago". Só aparece para o admin da plataforma.</p>
  <div id="lista">Carregando…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js?v=9780c58f"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var reais = function (n) { return 'R$ ' + Number(n || 0).toFixed(2).replace('.', ','); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function carregar() {
    db.rpc('admin_repasses_pendentes').then(function (r) {
      if (r.error) { $('lista').textContent = 'Só o admin da plataforma vê esta página (entre com a conta de admin).'; return; }
      var l = r.data || [];
      if (!l.length) { $('lista').innerHTML = '<p class="ok">Nada a repassar agora.</p>'; return; }
      $('lista').innerHTML = l.map(function (x, i) {
        return '<div class="c"><b>' + esc(x.nome) + '</b> — ' + reais(x.valor) + '<small>' + esc(x.instagram || '') + ' · ' + esc(x.cidade || '') + ' · ' + x.qtd + ' pagamentos até ' + esc(x.ate) + '</small>' +
          (x.pode_pagar ? '' : '<small>Abaixo do mínimo: acumula para o mês seguinte.</small>') +
          '<button data-i="' + i + '"' + (x.pode_pagar ? '' : ' disabled') + '>Marcei como pago</button></div>';
      }).join('');
      $('lista').onclick = function (e) {
        var b = e.target.closest('button[data-i]'); if (!b) return;
        var x = l[+b.getAttribute('data-i')];
        if (!confirm('Confirmar que você já pagou ' + reais(x.valor) + ' para ' + x.nome + '?')) return;
        b.disabled = true;
        db.rpc('admin_repasse_marcar_pago', { p_criador_id: x.criador_id, p_ate: x.ate }).then(function () { carregar(); });
      };
    });
  }
  if (!window.db) { $('lista').textContent = 'Sem conexão.'; return; }
  db.auth.getSession().then(function (s) { if (s.data && s.data.session) carregar(); else location.href = 'cadastro.html'; });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastre seu estabelecimento — VB Agenda</title>
<meta name="description" content="Crie sua conta e cadastre seu salão, barbearia ou estúdio no VB Agenda.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=15">
</head>
<body class="com-tabbar">
  <header class="topbar">
    <a class="brand" href="index.html">VB <em>Agenda</em></a>
    <button class="btn btn-ghost oculto" id="sairBtn" type="button" style="padding:0.5rem 1rem; font-size:0.9rem;">Sair</button>
  </header>

  <div class="container" style="padding-top:1.75rem; padding-bottom:3rem;">

    <!-- Login / cadastro de conta -->
    <section id="authBox">
      <div class="card">
        <h2>Entrar ou criar conta</h2>
        <button class="btn btn-google" id="googleBtn" type="button">Continuar com Google</button>
        <div class="divisor">ou por e-mail</div>
        <form id="emailForm">
          <div class="field">
            <label for="authEmail">E-mail</label>
            <input type="email" id="authEmail" required autocomplete="email">
          </div>
          <div class="field">
            <label for="authSenha">Senha</label>
            <input type="password" id="authSenha" required minlength="6" autocomplete="current-password">
          </div>
          <button class="btn btn-primario" id="entrarBtn" type="submit" style="width:100%;">Entrar</button>
        </form>
        <p style="text-align:center; margin:0.9rem 0 0; font-size:0.9rem;">
          Não tem conta? <a href="#" id="criarContaLink">Criar agora</a>
        </p>
        <p class="msg" id="authMsg"></p>
      </div>
    </section>

    <!-- Área logada -->
    <section id="painelBox" class="oculto">
      <p class="msg" style="background:#fdf3e0; color:#8a5a00; padding:0.6rem 0.9rem; border-radius:10px; margin:0 0 1rem;">Modo de teste: login temporariamente desativado pra testar o cadastro.</p>
      <div class="card" id="listaCard">
        <h2>Seus estabelecimentos</h2>
        <ul class="dash-lista" id="listaEstabelecimentos"></ul>
        <p class="msg" id="listaMsg" style="margin-top:0.8rem;"></p>
      </div>

      <div class="card">
        <h2>Cadastrar novo estabelecimento</h2>
        <form id="estabForm">
          <div class="field">
            <label for="estabNome">Nome do estabelecimento</label>
            <input type="text" id="estabNome" required placeholder="Ex: Rafael Cabeleireiros">
          </div>
          <div class="field">
            <label for="estabSlug">Link (gerado a partir do nome, pode editar)</label>
            <div class="prefixo">
              <span>vbagenda.com.br/</span>
              <input type="text" id="estabSlug" required pattern="[a-z0-9\-]+" placeholder="rafael-cabeleireiros">
            </div>
          </div>
          <div class="field">
            <label for="estabCidade">Cidade</label>
            <input type="text" id="estabCidade" required value="Itapetininga">
          </div>
          <div class="field">
            <label for="estabSegmento">Segmento</label>
            <select id="estabSegmento" required>
              <option value="barbearia">Barbearia</option>
              <option value="salao">Salão de beleza</option>
              <option value="manicure_pedicure">Manicure e pedicure</option>
              <option value="estetica">Estética</option>
              <option value="estetica_automotiva">Estética automotiva</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="field">
            <label for="estabWhatsapp">WhatsApp (com DDD)</label>
            <input type="tel" id="estabWhatsapp" placeholder="15999999999">
          </div>
          <div class="field">
            <label>Estilo do site</label>
            <div id="estabTemplateEscolha" style="display:grid; grid-template-columns:repeat(2,1fr); gap:0.6rem;"></div>
          </div>
          <div class="field">
            <label>Foto principal do site</label>
            <div id="heroPreviewCadastro" style="width:100%; max-width:260px; aspect-ratio:4/5; border-radius:10px; background-size:cover; background-position:center; background-color:#eee; border:1px solid var(--borda); margin-bottom:0.75rem;"></div>
            <input type="file" id="estabHeroUpload" accept="image/*" style="margin-bottom:0.75rem;">
            <p class="cidade" style="margin:0 0 0.5rem;">ou escolha uma pronta:</p>
            <div id="estabHeroEstoque" style="display:flex; gap:0.6rem; flex-wrap:wrap;"></div>
          </div>
          <button class="btn btn-primario" id="criarEstabBtn" type="submit" style="width:100%;">Criar estabelecimento</button>
          <p class="msg" id="estabMsg"></p>
        </form>
      </div>
    </section>

  </div>

  <nav class="tabbar">
    <a class="tabbar-item" href="index.html"><svg class="tabbar-icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>Catálogo</a>
    <a class="tabbar-item is-ativo" href="cadastro.html"><svg class="tabbar-icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1-5h16l1 5"/><path d="M3 9a2 2 0 004 0 2 2 0 004 0 2 2 0 004 0 2 2 0 004 0"/><path d="M5 9v10h14V9"/><path d="M9 19v-6h6v6"/></svg>Cadastrar</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js?v=1"></script>
  <script src="assets/js/upload-fotos.js?v=1"></script>
  <script src="assets/js/cadastro.js?v=8"></script>
</body>
</html>

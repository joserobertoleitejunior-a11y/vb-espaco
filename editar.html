<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar estabelecimento — VB Agenda</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=10">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="cadastro.html">
      <span id="cube3d" aria-hidden="true"></span>
      VB <em>Agenda</em>
    </a>
    <a class="btn btn-ghost" id="verPerfilBtn" href="#" target="_blank" rel="noopener" style="padding:0.5rem 1rem; font-size:0.85rem;">Ver site →</a>
  </header>

  <div class="container" style="padding-top:1.5rem; padding-bottom:3rem;">
    <h1 id="tituloEstab" style="font-size:1.4rem; margin:0 0 1.25rem;">Carregando…</h1>

    <!-- Serviços -->
    <div class="card">
      <h2>Serviços e valores</h2>
      <ul class="lista-estabelecimentos" id="listaServicos"></ul>
      <form id="formServico" style="margin-top:1rem; display:grid; gap:0.75rem; grid-template-columns:2fr 1fr; align-items:end;">
        <div class="field" style="margin:0;">
          <label>Nome do serviço</label>
          <input type="text" id="servNome" required placeholder="Ex: Corte masculino">
        </div>
        <div class="field" style="margin:0;">
          <label>Preço (R$)</label>
          <input type="number" id="servPreco" required min="0" step="0.01" placeholder="45">
        </div>
        <div class="field" style="margin:0; grid-column:1/2;">
          <label>Categoria</label>
          <select id="servCategoria">
            <option value="unissex">Unissex</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
          </select>
        </div>
        <button class="btn btn-primario" type="submit" style="grid-column:2/3;">Adicionar</button>
      </form>
      <p class="msg" id="servMsg"></p>
    </div>

    <!-- Equipe -->
    <div class="card">
      <h2>Equipe</h2>
      <ul class="lista-estabelecimentos" id="listaEquipe"></ul>
      <form id="formEquipe" style="margin-top:1rem; display:grid; gap:0.75rem; grid-template-columns:1fr 1fr; align-items:end;">
        <div class="field" style="margin:0;">
          <label>Nome</label>
          <input type="text" id="eqNome" required placeholder="Ex: Rafael">
        </div>
        <div class="field" style="margin:0;">
          <label>Especialidade</label>
          <input type="text" id="eqEspecialidade" placeholder="Ex: Cortes e barba">
        </div>
        <div class="field" style="margin:0; grid-column:1/3;">
          <label>Link da foto (opcional)</label>
          <input type="url" id="eqFoto" placeholder="https://...">
        </div>
        <button class="btn btn-primario" type="submit" style="grid-column:1/3;">Adicionar à equipe</button>
      </form>
      <p class="msg" id="eqMsg"></p>
    </div>

    <!-- Horários -->
    <div class="card">
      <h2>Horário de funcionamento</h2>
      <div id="listaHorarios" style="display:flex; flex-direction:column; gap:0.6rem;"></div>
      <p class="msg" id="horMsg"></p>
    </div>

    <!-- Galeria -->
    <div class="card">
      <h2>Galeria de fotos</h2>
      <ul class="lista-estabelecimentos" id="listaGaleria"></ul>
      <form id="formGaleria" style="margin-top:1rem; display:flex; gap:0.6rem;">
        <input type="url" id="galFoto" required placeholder="Link da foto (https://...)" style="flex:1; padding:0.75rem 0.9rem; border:1px solid var(--borda); border-radius:10px; font-family:inherit;">
        <button class="btn btn-primario" type="submit">Adicionar</button>
      </form>
      <p class="msg" id="galMsg"></p>
    </div>

    <!-- Agenda -->
    <div class="card">
      <h2>Agenda</h2>
      <ul class="lista-estabelecimentos" id="listaAgenda"></ul>
      <p class="msg" id="agMsg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js?v=1"></script>
  <script type="module" src="assets/js/vb-cube3d.js?v=3"></script>
  <script src="assets/js/editar.js?v=1"></script>
</body>
</html>
